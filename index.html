    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; /* Черный фон, если картинка где-то кончится */
            overflow-x: hidden; /* Убираем боковую прокрутку, оставляем только вниз */
        }
        .container { 
            position: relative; 
            width: 100%; 
            line-height: 0; /* Убирает микро-отступ под картинкой */
        }
        img { 
            width: 100vw; /* Картинка всегда на всю ширину окна */
            height: auto; 
            display: block;
        }
        
        /* Стиль всплывающего окошка */
        #custom-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            display: none;
            z-index: 1000;
            pointer-events: none;
            max-width: 280px;
            line-height: 1.4;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-family: sans-serif;
        }
    </style>
</head>

<script>
    const tooltip = document.getElementById('custom-tooltip');
    const areas = document.querySelectorAll('area');

    areas.forEach(area => {
        area.addEventListener('mouseover', function() {
            const text = this.getAttribute('data-tip');
            if (text) {
                tooltip.innerHTML = text;
                tooltip.style.display = 'block';
            }
        });

        area.addEventListener('mousemove', function(e) {
            // Центрируем тултип относительно курсора
            tooltip.style.left = (e.pageX + 15) + 'px';
            tooltip.style.top = (e.pageY + 15) + 'px';
        });

        area.addEventListener('mouseout', function() {
            tooltip.style.display = 'none';
        });
    });
</script>
